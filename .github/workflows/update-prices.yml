name: Update oil prices

on:
  schedule:
    # Times are Asia/Bangkok (UTC+7); cron is UTC.
    # New prices take effect at 05:00 ICT, so the morning runs publish them.
    - cron: "0 22 * * *" # 05:00 ICT
    - cron: "0 23 * * *" # 06:00 ICT
    # Evening runs catch an announcement early. It carries tomorrow's
    # effective date, so the fetcher holds it back until the 00:00 run.
    - cron: "30 10 * * *" # 17:30 ICT
    - cron: "0 15 * * *" # 22:00 ICT
    - cron: "0 17 * * *" # 00:00 ICT
  workflow_dispatch:

concurrency:
  group: update-prices
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and sanity-check prices
        id: fetch
        run: node scripts/fetch-prices.mjs 2>&1 | tee fetch.log

      - name: Commit updated prices
        run: |
          if git diff --quiet -- data/oil-prices.json; then
            echo "Nothing to commit."
            exit 0
          fi
          # A daily restamp touches updated_at only; a real change moves prices.
          today=$(TZ=Asia/Bangkok date +%Y-%m-%d)
          if git diff -U0 -- data/oil-prices.json | grep -qE '^[-+].*"price":'; then
            message="data: update oil prices ($today)"
          else
            message="data: refresh the price timestamp ($today)"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oil-prices.json
          git commit -m "$message"
          git push

      - name: Open an issue when the update fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('fetch.log')
              ? fs.readFileSync('fetch.log', 'utf8').slice(-4000)
              : '(no log captured)';
            const raw = fs.existsSync('data/last-raw-response.json')
              ? fs.readFileSync('data/last-raw-response.json', 'utf8').slice(0, 6000)
              : '(no raw response captured)';
            const title = 'อัปเดตราคาน้ำมันล้มเหลว — ต้องตรวจสอบด้วยตนเอง';

            // Reuse the open issue instead of piling up one per failed day.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'price-update-failed',
            });
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '`data/oil-prices.json` ถูกคงค่าเดิมไว้ ไม่มีการ deploy ราคาใหม่',
              '',
              '### Log',
              '```',
              log,
              '```',
              '',
              '<details><summary>Raw API response</summary>',
              '',
              '```json',
              raw,
              '```',
              '',
              '</details>',
            ].join('\n');

            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['price-update-failed'],
              });
            }
